# Local Postgres + PostgREST. Set VITE_DB=postgres in app/.env to use it.
# Schema is applied on first start only. Reset with: docker compose down -v
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/local/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./supabase/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/local/02_grants.sql:/docker-entrypoint-initdb.d/02_grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"]
      interval: 2s
      retries: 20

  api:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/jobs
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
